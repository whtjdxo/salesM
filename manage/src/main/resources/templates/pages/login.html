    <!-- ===============================================-->

    <link href="/css/theme-rtl.css" rel="stylesheet" id="style-rtl" />
    <link href="/css/theme.css" rel="stylesheet" id="style-default" />
    <link href="/css/user-rtl.css" rel="stylesheet" id="user-style-rtl" />
    <link href="/css/user.css" rel="stylesheet" id="user-style-default" />
    <script>
      var isRTL = JSON.parse(localStorage.getItem('isRTL'));
      if (isRTL) {
        var linkDefault = document.getElementById('style-default');
        var userLinkDefault = document.getElementById('user-style-default');
        linkDefault.setAttribute('disabled', true);
        userLinkDefault.setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        var linkRTL = document.getElementById('style-rtl');
        var userLinkRTL = document.getElementById('user-style-rtl');
        linkRTL.setAttribute('disabled', true);
        userLinkRTL.setAttribute('disabled', true);
      }

      $(document).ready(function () {
        // ✅ 페이지 로드 시 저장된 ID 세팅
        var savedId = localStorage.getItem("savedUserId");
        if (savedId) {
          $("#userId").val(savedId);
          $("#rememberId").prop("checked", true);
        }

        // 2중인증 적용시해제
        /*
        function showTotpStep(enrollment, secret) {
          $("#loginForm").hide();
          $("#totpTitle").text(enrollment ? "2단계 인증 등록" : "2단계 인증");
          $("#totpDescription").text(enrollment
            ? "인증 앱에서 QR 코드를 스캔한 뒤 앱에 표시된 6자리 코드를 입력해 주세요."
            : "인증 앱에 표시된 6자리 코드를 입력해 주세요.");
          $("#totpEnrollment").toggle(enrollment);
          $("#totpSecret").text(secret || "");
          if (enrollment) {
            $("#totpQr").attr("src", "/totp/qr?t=" + Date.now());
          }
          $("#totpStep").show();
          $("#totpCode").val("").trigger("focus");
        }

        function verifyTotp() {
          var code = $("#totpCode").val().trim();
          if (!/^\d{6}$/.test(code)) {
            alert("인증 앱에 표시된 6자리 코드를 입력해 주세요.");
            $("#totpCode").trigger("focus");
            return;
          }

          var endpoint = $("#totpEnrollment").is(":visible") ? "/enrollTotp" : "/verifyTotp";
          $.ajax({
            url: endpoint,
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ code: code }),
            success: function (data) {
              if (data.resultCode === "00") {
                location.href = "/main";
              } else {
                alert(data.resultMsg || "인증 코드 확인에 실패했습니다.");
                $("#totpCode").val("").trigger("focus");
              }
            },
            error: function () {
              alert("2단계 인증 요청에 실패했습니다. 다시 시도해 주세요.");
            }
          });
        }
        */

        $("#btnLogin").on("click", function () {
          var userId = $("#userId").val().trim();
          var userPwd = $("#userPwd").val().trim();
          var remember = $("#rememberId").is(":checked");

          if (userId === "") {
            alert("아이디를 입력해주세요");
            $("#userId").focus();
            return;
          }
          if (userPwd === "") {
            alert("비밀번호를 입력해주세요");
            $("#userPwd").focus();
            return;
          }

          // ✅ localStorage 저장/삭제
          if (remember) {
            localStorage.setItem("savedUserId", userId);
          } else {
            localStorage.removeItem("savedUserId");
          }

          $.ajax({
            url: "/chkLogin",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ userId: userId, userPwd: userPwd }),
            success: function (data) {
              // 2중인증 적용시해제
              /*
              if (data.resultCode === "ENROLL") {
                showTotpStep(true, data.returnVal);
              } else if (data.resultCode === "VERIFY") {
                showTotpStep(false, "");
              } else
              */
              if (data.resultCode === "00") {
                location.href = "/main";
              } else {
                alert(data.resultMsg || "아이디 또는 비밀번호가 일치하지 않습니다.");
              }
            },
            error: function () {
              alert("로그인 요청 실패");
            }
          });
        });

        $("#userId").on("keydown", function (e) {
          if (e.key === "Enter") {
            $("#btnLogin").click();
          }
        });

        $("#userPwd").on("keydown", function (e) {
          if (e.key === "Enter") {
            $("#btnLogin").click();
          }
        });

        // 2중인증 적용시해제
        /*
        $("#btnVerifyTotp").on("click", verifyTotp);
        $("#totpCode").on("keydown", function (e) {
          if (e.key === "Enter") {
            verifyTotp();
          }
        });
        $("#btnRestartLogin").on("click", function () {
          $.post("/totp/cancel").always(function () {
            location.reload();
          });
        });
        */
      });
    </script>
  </head>

  <body>
    <!-- ===============================================-->
    <!--    Main Content-->
    <!-- ===============================================-->
    <main class="main" id="top" style="background: url('/img/op_login_bg.png') no-repeat center center; background-size: cover; width: 100%; height: 100%; margin: 0 auto;">
      <div class="container" data-layout="container" style="height: 100%;">
      <script>
        var isFluid = JSON.parse(localStorage.getItem('isFluid'));
        if (isFluid) {
        var container = document.querySelector('[data-layout]');
        container.classList.remove('container');
        container.classList.add('container-fluid');
        }
      </script>
        <div class="row flex-center min-vh-100 py-6" style="height: 80%;">
          <div class="col-sm-10 col-md-6 col-lg-4 col-xl-3 col-xxl-3">
            <div class="card">
              <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                  <img class="d-block mx-auto mb-4" src="/img/logo.png" alt="Logo" style="max-width: 100%; height: auto;" />
                  <h3 class="text-end">
                    <span style="color: #0074d9;">매출정산</span>
                    <span style="color: #000;"> 관리시스템</span>
                  </h3>
                </div>
                <div class="row flex-between-center mb-2">
                  <div class="col-auto">
                  <h5>Log in</h5>
                  </div>
                </div>
                <form id="loginForm" name="loginForm" class="needs-validation" novalidate="">
                  <div class="mb-3">
                  <input class="form-control" type="text" name="userId" id="userId" placeholder="사용자 아이디" required="" /></div>
                  <div class="mb-3">
                  <input class="form-control" type="password" name="userPwd" id="userPwd" placeholder="비밀번호" required="" /></div>
                  <div class="row flex-between-center">
                    <div class="col-auto">
                      <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="rememberId" checked="checked" />
                        <label class="form-check-label mb-0" for="rememberId">Remember me</label>
                      </div>
                    </div>
                  </div>
                  <div class="mb-3">
                    <button class="btn btn-primary d-block w-100 mt-3" type="button" name="btnLogin" id="btnLogin">Login</button>
                  </div>
                </form>
                <!-- 2중인증 적용시해제
                <section id="totpStep" style="display: none;">
                  <h5 id="totpTitle">2단계 인증</h5>
                  <p id="totpDescription" class="small text-body-secondary"></p>
                  <div id="totpEnrollment" class="text-center mb-3" style="display: none;">
                    <img id="totpQr" alt="인증 앱 등록 QR 코드" width="240" height="240" />
                    <p class="small mt-2 mb-1">QR 코드를 사용할 수 없다면 아래 키를 인증 앱에 직접 입력하세요.</p>
                    <code id="totpSecret" class="user-select-all"></code>
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="totpCode">인증 코드</label>
                    <input class="form-control" type="text" id="totpCode" inputmode="numeric"
                      autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6자리 코드" />
                  </div>
                  <button class="btn btn-primary d-block w-100" type="button" id="btnVerifyTotp">확인</button>
                  <button class="btn btn-link d-block w-100 mt-2" type="button" id="btnRestartLogin">로그인 처음으로</button>
                </section>
                -->
                </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- ===============================================-->
    <!--    End of Main Content-->
    <!-- ===============================================-->

    <!-- ===============================================-->
    <script src="/vendors/popper/popper.min.js"></script>
    <script src="/vendors/bootstrap/bootstrap.min.js"></script>
    <script src="/vendors/anchorjs/anchor.min.js"></script>
    <script src="/vendors/is/is.min.js"></script>
    <script src="/vendors/fontawesome/all.min.js"></script>
    <script src="/vendors/lodash/lodash.min.js"></script>
    <script src="/vendors/list.js/list.min.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>
